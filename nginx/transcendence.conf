# WebSocket Upgrade helper
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
 listen 80;
 server_name localhost;
    
  # Redirect HTTP to HTTPS
  return 301 https://$server_name$request_uri;
}

server {
  listen 0.0.0.0:443 ssl http2;
  listen 127.0.0.1:443 ssl http2;
  listen [::]:443 ssl http2;
  server_name localhost 127.0.0.1 *.42london.com;

  ssl_certificate     /etc/nginx/ssl/certs/cert.crt;
  ssl_certificate_key /etc/nginx/ssl/private/key.key;

  # Common proxy headers
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # --- Frontend  ---
  location / {
    proxy_hide_header Cross-Origin-Opener-Policy;
    add_header Cross-Origin-Opener-Policy "unsafe-none" always;
    add_header Content-Security-Policy "frame-ancestors 'self';" always;

    proxy_http_version 1.1;
    proxy_pass https://frontend:443;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
  }

  # --- API (prefix kept as /api) ---
  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    # proxy_pass http://backend:3000/api/;
    proxy_pass https://backend:3000/api/;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
  }

  # --- WebSocket ---
  location /ws {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_set_header Cookie $http_cookie;
    # proxy_pass http://backend:3000/ws;
    proxy_pass https://backend:3000/ws;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;

    # Disable buffering for WebSocket
    proxy_buffering off;

    # Keep alive settings
    # proxy_set_header X-Real-IP $remote_addr;
    # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # proxy_set_header X-Forwarded-Proto $scheme;
  }
}


